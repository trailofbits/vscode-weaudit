version: 2
updates:
    # npm for TypeScript/JavaScript dependencies
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10
      labels:
          - "dependencies"
          - "npm"
      versioning-strategy: increase
      cooldown:
          default-days: 7
      ignore:
          # @types/vscode must track engines.vscode, i.e. the oldest VS Code we
          # support, rather than the newest release. Typing against a newer API
          # than we declare lets us call methods absent on our minimum version.
          - dependency-name: "@types/vscode"
      groups:
          npm-dependencies:
              patterns:
                  - "*"

    # GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
          - "github-actions"
      cooldown:
          default-days: 7
      groups:
          github-actions:
              patterns:
                  - "*"
